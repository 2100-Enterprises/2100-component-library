# Catches bugs and unsafe HTML, not style. Rails/OutputSafety fails on html_safe and raw,
# which matters because PRs that only touch app/components can merge without a person.
inherit_from: .rubocop_todo.yml

# The todo list's Exclude entries add to the ones below rather than replacing them.
inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-rails

AllCops:
  DisabledByDefault: true
  NewCops: disable
  SuggestExtensions: false
  TargetRubyVersion: 3.2
  Exclude:
    - "gemfiles/**/*"
    - "pkg/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

Lint:
  Enabled: true

Security:
  Enabled: true

Rails/OutputSafety:
  Enabled: true

# An inline disable would get past Rails/OutputSafety in a PR that merges without a person.
Style/DisableCopsWithinSourceCodeDirective:
  Enabled: true
  AllowedCops:
    - Lint/UselessMethodDefinition

# Size and complexity ceilings. Each Max sits just above the library's 95th percentile on
# 2026-11-12, so they catch the outliers without failing ordinary component code. Tests and
# config are left out: long test classes and setup methods are normal there. Split a method
# that goes over rather than excluding its file.

Metrics/MethodLength:
  Enabled: true
  Max: 11
  Exclude: &metrics_exclude
    - "test/**/*"
    - "config/**/*"

Metrics/AbcSize:
  Enabled: true
  Max: 16
  Exclude: *metrics_exclude

Metrics/CyclomaticComplexity:
  Enabled: true
  Max: 6
  Exclude: *metrics_exclude

Metrics/PerceivedComplexity:
  Enabled: true
  Max: 6
  Exclude: *metrics_exclude

Metrics/ClassLength:
  Enabled: true
  Max: 100
  Exclude: *metrics_exclude

Metrics/ModuleLength:
  Enabled: true
  Max: 100
  Exclude: *metrics_exclude

# Keyword arguments name themselves, so only positional ones count. Five leaves room for the
# form builder's overrides, which keep Rails' own positional signatures.
Metrics/ParameterLists:
  Enabled: true
  Max: 5
  CountKeywordArgs: false
  Exclude: *metrics_exclude

Metrics/BlockNesting:
  Enabled: true
  Max: 3
