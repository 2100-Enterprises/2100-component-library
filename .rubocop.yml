# Catches bugs and unsafe HTML, not style. Rails/OutputSafety fails on html_safe and raw,
# which matters because PRs that only touch app/components can merge without a person.
plugins:
  - rubocop-rails

AllCops:
  DisabledByDefault: true
  NewCops: disable
  SuggestExtensions: false
  TargetRubyVersion: 3.2
  Exclude:
    - "gemfiles/**/*"
    - "pkg/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

Lint:
  Enabled: true

Security:
  Enabled: true

Rails/OutputSafety:
  Enabled: true

# An inline disable would get past Rails/OutputSafety in a PR that merges without a person.
Style/DisableCopsWithinSourceCodeDirective:
  Enabled: true
  AllowedCops:
    - Lint/UselessMethodDefinition

# Throwaway change to test that a sensitive PR is blocked. Never merge this.
