# Moves pull requests on once CI has passed. See bin/pr-triage.
name: PR triage

# Both triggers run this file and bin/pr-triage as they are on development, so a PR can't
# rewrite its own triage. Never check out a PR's code here: these jobs hold write tokens,
# and this repo is public, so anyone can open a PR.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

jobs:
  advance:
    name: Advance
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Merges and labels.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: development
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
      - name: Advance the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bin/pr-triage advance

  human_review:
    name: Human review
    if: github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'development'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Reads the PR, and changes its review labels.
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: development
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
      - name: Check human review
        env:
          EVENT_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bin/pr-triage check
